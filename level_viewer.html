<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Web Level Viewer</title>
    <style>
        @font-face {
			font-family: 'Roboto';
			src: url('fonts/Roboto-Regular.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
        body { 
            margin: 0; 
            font-family: Arial, sans-serif; 
            overflow: hidden;
        }
        
        /* Full-screen canvas container */
        #container { 
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Navigation bar at the top */
        #navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(68, 138, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 0 24px;
            box-sizing: border-box;
            z-index: 1000;
        }
        
        #navbar label {
            color: white;
            font-weight: bold;
            font-size: 16px;
        }
        
        #navbar input {
            width: 100px;
            padding: 8px 12px;
            border: 2px solid white;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
        }
        
        #navbar button {
            padding: 8px 16px;
            border: 2px solid white;
            border-radius: 6px;
            background: white;
            color: #448aff;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }
        
        #navbar button:hover {
            background: #f0f0f0;
            transform: scale(1.05);
        }
        
        #navbar button:active {
            transform: scale(0.95);
        }
        
        .nav-arrow {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        #level-info {
            color: white;
            font-size: 14px;
            margin-left: 16px;
        }
        
        /* Canvas area */
        #main {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            height: calc(100vh - 60px);
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eaf6ff;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="navbar">
            <button id="prev-btn" class="nav-arrow">◀</button>
            <label for="level-number">Level:</label>
            <input type="number" id="level-number" value="1" min="1" />
            <button id="go-btn">Go</button>
            <button id="next-btn" class="nav-arrow">▶</button>
            <span id="level-info"></span>
        </div>
        <div id="main">
            <div id="viewer-game"></div>
        </div>
    </div>
    <script src="phaser.min.js"></script>
    <script src="config.js"></script>
    <script type="module" src="level_viewer.js"></script>
</body>
</html>
