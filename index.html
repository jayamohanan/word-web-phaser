
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Word Web Phaser Game</title>
	<style>
		@font-face {
			font-family: 'Petita';
			src: url('fonts/petitaMedium.ttf') format('truetype');
			font-weight: 500;
			font-style: normal;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
		}
		#game-container {
			width: 100%;
			height: 100%;
		}
		canvas {
			display: block;
		}
	</style>
</head>
<body>
	<div id="game-container"></div>
	<script src="phaser.min.js"></script>
	<script src="config.js"></script>
	<script type="module" src="game.js"></script>
</body>
</html>
